# Desarrollo local: Mosquitto. La base de datos es Supabase (ver .env).
# Uso:  docker compose up -d   y luego   ./mvnw spring-boot:run
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

