# Desarrollo local: Redis + Mosquitto. La base de datos es Supabase (ver .env).
# Uso:  docker compose up -d   y luego   ./mvnw spring-boot:run
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  # Opcional: el backend en contenedor (descomenta para probar la imagen de despliegue)
