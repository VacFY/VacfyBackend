# Opcional: en desarrollo ya no hace falta. El .env apunta a Supabase y al broker MQTT en la nube.
# Sirve para una VM de despliegue con backend + Mosquitto propio (ver "Desplegar" en el README).
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

